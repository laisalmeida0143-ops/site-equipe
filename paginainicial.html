<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Equipe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f4f4f4;
}

h1 {
    margin-top: 20px;
}

.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin: 30px;
}

.card {
    background-color: white;
    border-radius: 10px;
    width: 180px;
    padding: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    transition: transform 0.2s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.card a {
    text-decoration: none;
    color: black;
}
    </style>
</head>
<body>

    <h1>Conheça a Equipe</h1>

    <div class="container">

        <div class="card">
            <a href="pedro_pizzi.html">
                <img src="img/pedro_pizzi.jpg" alt="Pedro Pizzi">
                <h2>Pedro Pizzi</h2>
            </a>
        </div>

        <div class="card">
            <a href="pedro_nicolas.html">
                <img src="img/pedro_nicolas.jpg" alt="Pedro Nicolas">
                <h2>Pedro Nicolas</h2>
            </a>
        </div>

        <div class="card">
            <a href="PagRafa.html">
                <img src="rafa.jpeg" alt="Rafaella Rosa">
                <h2>Rafaella Rosa</h2>
            </a>
        </div>

        <div class="card">
            <a href="lais_casteluci.html">
                <img src="img/lais_casteluci.jpg" alt="Laís Casteluci">
                <h2>Laís Casteluci</h2>
            </a>
        </div>

        <div class="card">
            <a href="lucas_paraguassu.html">
                <img src="img/lucas_paraguassu.jpg" alt="Lucas Paraguassu">
                <h2>Lucas Paraguassu</h2>
            </a>
        </div>

    </div>

</body>
</html>
